spring:
  application:
    name: load-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/load}
    username: ${DB_USERNAME:load}
    password: ${DB_PASSWORD:load}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

load:
  security:
    jwt:
      secret: ${JWT_SECRET:this-is-a-local-development-only-secret-value-change-me}
      expiry-seconds: ${JWT_EXPIRY_SECONDS:3600}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
