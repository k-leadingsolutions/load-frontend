spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

load:
  security:
    jwt:
      # No default: refuses to start rather than silently running with the
      # local development secret committed in application.yml.
      secret: ${JWT_SECRET}
      expiry-seconds: ${JWT_EXPIRY_SECONDS:3600}
    cors:
      # No default: the frontend's production origin(s) must be supplied
      # explicitly (comma-separated) — never falls back to the dev Vite ports.
      allowed-origins: ${CORS_ALLOWED_ORIGINS}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

management:
  endpoint:
    health:
      show-details: never
