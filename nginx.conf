server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Baseline hardening headers. Deliberately conservative (no CSP) to avoid
    # breaking the existing frozen layouts/workflows without an audit of every
    # external resource the SPA loads; these are pure defence-in-depth and
    # never affect token handling, which is unauthenticated JS-attached
    # Authorization headers (see tokenStore.ts), not cookies.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client-side routing (React Router) — unmatched paths fall back to the
    # SPA shell rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
