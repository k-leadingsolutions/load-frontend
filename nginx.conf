server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (React Router) — unmatched paths fall back to the
    # SPA shell rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
